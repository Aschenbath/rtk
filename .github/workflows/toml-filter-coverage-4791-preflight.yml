name: TOML filter coverage 4791 preflight

on:
  push:
    branches: [ci/toml-filter-coverage-4791-preflight]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toml-filter-coverage-4791-preflight
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'Aschenbath/rtk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      EXPECTED_BASE: e05c7bdfacfcfe1f845d11f47339e4eae63eb3f5
      EXPECTED_PATCH: 4c1997611df877b007041dfe78b646109832e15d669516d07374a45c81bf9ad8
      EXPECTED_TREE: cc1442bee91953c84c7c59fd1c54d4f60478229e
      EXPECTED_CHECKER: 74fc7c12c7cdaa43bba37544f4f197127c74f8fa6e57ac2e493049317ba65c75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e05c7bdfacfcfe1f845d11f47339e4eae63eb3f5
          persist-credentials: false
      - name: Apply and verify the uncommitted source patch
        env:
          PATCH_GZIP_B64: ${{ vars.RTK_4791_PATCH_GZIP_B64 }}
          CHECKER_B64: ${{ vars.RTK_4791_CHECKER_B64 }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_BASE']
          root = Path(os.environ['RUNNER_TEMP'])
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_B64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == os.environ['EXPECTED_PATCH']
          target = root / 'proposed.patch'
          target.write_bytes(patch)
          paths = {
              'src/analytics/README.md', 'src/discover/README.md',
              'src/discover/mod.rs', 'src/discover/registry.rs', 'src/discover/report.rs',
              'tests/toml_filter_coverage_test.rs',
          }
          assert {row.split('\t', 2)[2] for row in git('apply', '--numstat', str(target)).splitlines()} == paths
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(target)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', str(target)], check=True)
          subprocess.run(['git', 'add', '--', *sorted(paths)], check=True)
          assert git('write-tree') == os.environ['EXPECTED_TREE']
          checker = base64.b64decode(os.environ['CHECKER_B64'], validate=True)
          assert hashlib.sha256(checker).hexdigest() == os.environ['EXPECTED_CHECKER']
          (root / 'verify-cli.py').write_bytes(checker)
          print('Verified source patch:', os.environ['EXPECTED_PATCH'])
          print('Verified source tree:', git('write-tree'))
          print('Verified CLI checker:', os.environ['EXPECTED_CHECKER'])
          PY
          cat > "$RUNNER_TEMP/check-source.py" <<'PY'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_BASE']
          assert git('write-tree') == os.environ['EXPECTED_TREE']
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          assert not git('ls-files', '--others', '--exclude-standard')
          print('Source tree unchanged:', os.environ['EXPECTED_TREE'])
          PY
          python3 "$RUNNER_TEMP/check-source.py"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish tree ripgrep jq pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hook-check-4629
      - name: Check formatting before the source comparison
        run: |
          rustc --version
          cargo --version
          cargo fmt --all -- --check
          cargo fmt --manifest-path proxy/Cargo.toml --all -- --check
          python3 "$RUNNER_TEMP/check-source.py"
      - name: Prove regressions fail on the original production source
        id: baseline
        run: |
          set -euo pipefail
          paths=(src/discover/registry.rs src/discover/mod.rs src/discover/report.rs)
          trap 'git restore --worktree -- "${paths[@]}"' EXIT
          for path in "${paths[@]}"; do
            git show "$EXPECTED_BASE:$path" > "$path"
          done
          set +e
          cargo test --locked --test toml_filter_coverage_test > "$RUNNER_TEMP/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$result" -ne 0
          python3 <<'PY'
          import os
          from pathlib import Path
          output = (Path(os.environ['RUNNER_TEMP']) / 'baseline.log').read_text()
          assert 'running 6 tests' in output
          assert 'test result: FAILED. 2 passed; 4 failed;' in output
          for name in ['discover_separates_toml_tools_and_preserves_native_metadata',
                       'session_counts_toml_commands_in_chains',
                       'custom_filter_coverage_requires_current_trust',
                       'issue_examples_are_supported_and_still_rewrite']:
              assert f'test {name} ... FAILED' in output, name
          print('Confirmed four classification regressions; two rewrite/disable controls passed')
          PY
          python3 "$RUNNER_TEMP/verify-cli.py" --rtk "$PWD/target/$CARGO_BUILD_TARGET/debug/rtk" --expect baseline --report "$RUNNER_TEMP/cli-baseline.json"
          git restore --worktree -- "${paths[@]}"
          trap - EXIT
          python3 "$RUNNER_TEMP/check-source.py"
      - name: Run complete required quality gates on the final source
        id: quality
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 "$RUNNER_TEMP/check-source.py"
          cargo clippy --workspace --all-targets -- -D warnings
          python3 "$RUNNER_TEMP/check-source.py"
          cargo test --all --no-fail-fast
          python3 "$RUNNER_TEMP/check-source.py"
          cargo fmt --manifest-path proxy/Cargo.toml --all -- --check
      - name: Verify fixed CLI against synthetic sessions
        id: fixed
        run: |
          set -euo pipefail
          cargo test --locked --test toml_filter_coverage_test 2>&1 | tee "$RUNNER_TEMP/regression-fixed.log"
          python3 "$RUNNER_TEMP/verify-cli.py" --rtk "$PWD/target/$CARGO_BUILD_TARGET/debug/rtk" --expect fixed --report "$RUNNER_TEMP/cli-fixed.json"
          python3 "$RUNNER_TEMP/check-source.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toml-4791-evidence
          path: |
            ${{ runner.temp }}/baseline.log
            ${{ runner.temp }}/regression-fixed.log
            ${{ runner.temp }}/cli-baseline.json
            ${{ runner.temp }}/cli-fixed.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record preflight outcome
        if: always()
        env:
          BASELINE_RESULT: ${{ steps.baseline.outcome }}
          QUALITY_RESULT: ${{ steps.quality.outcome }}
          FIXED_RESULT: ${{ steps.fixed.outcome }}
        run: |
          {
            printf 'CI-only commit: %s\n\n' "$GITHUB_SHA"
            printf 'Source base: %s\n\n' "$EXPECTED_BASE"
            printf 'Source tree: %s\n\n' "$EXPECTED_TREE"
            printf 'Patch SHA-256: %s\n\n' "$EXPECTED_PATCH"
            printf 'CLI checker SHA-256: %s\n\n' "$EXPECTED_CHECKER"
            printf 'Baseline counterexamples: %s\n\n' "$BASELINE_RESULT"
            printf 'Required quality gates: %s\n\n' "$QUALITY_RESULT"
            printf 'Fixed CLI comparison: %s\n' "$FIXED_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
