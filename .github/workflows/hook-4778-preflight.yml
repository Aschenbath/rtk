name: hook 4778 preflight

# Fork-only. Runs the CI gates on the rtk-ai/rtk#4778 review changes (49087db)
# on Linux, macOS and Windows before re-review. This branch differs from
# 49087db only under .github/, which check-source.sh verifies before anything
# else runs. Test failures are also reported as annotations, which the API
# serves without a login, unlike job logs.

on:
  push:
    branches: [ci/hook-4778-preflight]

permissions:
  contents: read

concurrency:
  group: hook-4778-preflight
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  SOURCE_SHA: 49087db25d9fab649afe0c7d0377d43f081f079d
  PR_BASE: 32b2ec4386d90f27255ec984ea7b45ba42bf4694

jobs:
  lint:
    if: github.repository == 'Aschenbath/rtk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source under test is 49087db
        run: bash .github/preflight/check-source.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hook-4778-lint
      - run: rustc --version && cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path proxy/Cargo.toml --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps

  test:
    if: github.repository == 'Aschenbath/rtk'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source under test is 49087db
        shell: bash
        run: bash .github/preflight/check-source.sh
      # As in ci.yml: without fish, tests/fish_wrap_test.rs only covers the disabled path.
      - name: Install fish (wrap coverage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Install fish (wrap coverage)
        if: runner.os == 'macOS'
        run: brew install fish
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hook-4778-test
      - run: rustc --version
      # Not Git Bash on Windows: its /usr/bin puts GNU find ahead of find.exe, and
      # find_cmd's exit-status test then checks the wrong tool. ci.yml uses the
      # runner's default shell, which leaves System32 first. The log feeds the
      # annotations below.
      - name: cargo test --all
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: cargo test --all
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cargo test --locked --all --no-fail-fast > "%RUNNER_TEMP%\test.log" 2>&1
          set rc=%ERRORLEVEL%
          type "%RUNNER_TEMP%\test.log"
          exit /b %rc%
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" -I -X utf8 .github/preflight/annotate-failures.py "$RUNNER_TEMP/test.log"
      # Real `rtk hook claude` SessionStart calls against local listeners; runs
      # before the Apache-2.0 build, which replaces target/debug/rtk.
      - name: SessionStart hook end to end
        shell: bash
        run: |
          exe="$PWD/target/debug/rtk"
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then exe="$PWD/target/debug/rtk.exe"; py=python; fi
          "$py" -I -X utf8 .github/preflight/e2e_4778.py "$exe" "$RUNNER_TEMP/e2e"
      - name: cargo test --no-default-features (Apache-2.0 edition)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-default-features --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test-oss.log"
      - name: Report failing Apache-2.0 tests as annotations
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: python3 -I -X utf8 .github/preflight/annotate-failures.py "$RUNNER_TEMP/test-oss.log"

  semgrep:
    if: github.repository == 'Aschenbath/rtk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: semgrep scan --config .semgrep.yml --baseline-commit "$PR_BASE" --severity ERROR --error --metrics=off
      - run: semgrep scan --config .semgrep.yml --baseline-commit "$PR_BASE" --severity WARNING --metrics=off || true
