name: hook check 4629 preflight

on:
  push:
    branches: [ci/hook-check-4629-preflight]

permissions:
  contents: read

concurrency:
  group: hook-check-4629-preflight
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'Aschenbath/rtk'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      EXPECTED_BASE: 32b2ec4386d90f27255ec984ea7b45ba42bf4694
      EXPECTED_PATCH: f180869edf9836419c72db14e5cabc20b58aaa327cb826758ec59b924257d6b0
      EXPECTED_TREE: 99fb6477ba874fc2b650e335d814bbe006741978
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 32b2ec4386d90f27255ec984ea7b45ba42bf4694
          persist-credentials: false
      - name: Apply the fixed source patch
        env:
          PATCH_B64: ${{ vars.RTK_4629_PATCH_B64 }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_BASE']
          patch = base64.b64decode(os.environ['PATCH_B64'], validate=True)
          assert hashlib.sha256(patch).hexdigest() == os.environ['EXPECTED_PATCH']
          target = Path(os.environ['RUNNER_TEMP']) / 'proposed.patch'
          target.write_bytes(patch)
          expected = {
              'docs/guide/resources/troubleshooting.md',
              'src/core/hook_check_cmd.rs', 'src/core/mod.rs',
              'src/core/pipeline_config.rs', 'src/hooks/README.md',
              'src/lib.rs', 'tests/hook_check_pipeline_test.rs',
              'tests/hook_decision_protocol_test.rs',
          }
          rows = git('apply', '--numstat', str(target)).splitlines()
          assert {row.split('\t', 2)[2] for row in rows} == expected
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(target)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', str(target)], check=True)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          assert git('write-tree') == os.environ['EXPECTED_TREE']
          print('Verified source patch:', os.environ['EXPECTED_PATCH'])
          print('Verified source tree:', git('write-tree'))
          PY
          cat > "$RUNNER_TEMP/check-source.py" <<'PY'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_BASE']
          assert git('write-tree') == os.environ['EXPECTED_TREE']
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          assert not git('ls-files', '--others', '--exclude-standard')
          print('Source tree unchanged:', os.environ['EXPECTED_TREE'])
          PY
          python3 "$RUNNER_TEMP/check-source.py"
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish tree ripgrep jq pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hook-check-4629
      - name: Record toolchain and check formatting
        run: |
          rustc --version
          cargo --version
          cargo fmt --all -- --check
          cargo fmt --manifest-path proxy/Cargo.toml --all -- --check
          python3 "$RUNNER_TEMP/check-source.py"
      - name: Prove the pipeline diagnostic fails on the original source
        id: baseline
        run: |
          set -euo pipefail
          trap 'git restore --worktree -- src/core/hook_check_cmd.rs src/core/mod.rs src/core/pipeline_config.rs src/lib.rs' EXIT
          for source in src/core/mod.rs src/core/pipeline_config.rs src/lib.rs; do
            git show "${EXPECTED_BASE}:$source" > "$source"
          done
          rm src/core/hook_check_cmd.rs
          set +e
          cargo test --locked --test hook_check_pipeline_test > "$RUNNER_TEMP/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/baseline.log"
          test "$result" -ne 0
          python3 <<'PY'
          import os, re
          from pathlib import Path
          output = (Path(os.environ['RUNNER_TEMP']) / 'baseline.log').read_text()
          assert 'running 10 tests' in output, 'The regression tests did not execute'
          checks = [
              ('pipeline_deny_precedes_a_permission_allow', 'Some(2)'),
              ('pipeline_passthrough_agrees_with_the_native_hook', 'Some(1)'),
          ]
          for name, expected in checks:
              section = output.split('---- ' + name + ' stdout ----', 1)[1].split('---- ', 1)[0]
              assert re.search(r'left:\s*Some\(0\)', section), section
              assert 'right: ' + expected in section, section
          assert 'test other_agents_keep_their_existing_pipeline_scope ... ok' in output
          print('Confirmed RED: pipeline deny and passthrough were reported as rewrites; other-agent control passed')
          PY
          git restore --worktree -- src/core/hook_check_cmd.rs src/core/mod.rs src/core/pipeline_config.rs src/lib.rs
          trap - EXIT
          python3 "$RUNNER_TEMP/check-source.py"
      - name: Complete the required quality gates on the final source
        id: quality
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 "$RUNNER_TEMP/check-source.py"
          cargo clippy --workspace --all-targets -- -D warnings
          python3 "$RUNNER_TEMP/check-source.py"
          cargo test --all --no-fail-fast
          python3 "$RUNNER_TEMP/check-source.py"
          cargo fmt --manifest-path proxy/Cargo.toml --all -- --check
      - name: Record preflight outcome
        if: always()
        env:
          BASELINE_RESULT: ${{ steps.baseline.outcome }}
          QUALITY_RESULT: ${{ steps.quality.outcome }}
        run: |
          {
            printf 'CI-only commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Source base: `%s`\n\n' "$EXPECTED_BASE"
            printf 'Source tree: `%s`\n\n' "$EXPECTED_TREE"
            printf 'Patch SHA-256: `%s`\n\n' "$EXPECTED_PATCH"
            printf 'Baseline counterexample: %s\n\n' "$BASELINE_RESULT"
            printf 'Final required quality gates: %s\n' "$QUALITY_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
